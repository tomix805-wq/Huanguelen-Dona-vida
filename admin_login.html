
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrador | Huanguelén Dona Vida</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf4ff, #c8e2ff);
            padding: 20px;
        }

        .login {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px #4778a333;
            text-align: center;
        }

        .icono {
            font-size: 45px;
        }

        h1 {
            color: #1769c2;
            font-size: 25px;
        }

        p {
            color: #64748b;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            margin: 15px 0;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #1769c2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #10539e;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 8px;
        }

        .volver {
            display: inline-block;
            margin-top: 20px;
            color: #1769c2;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <main class="login">
        <div class="icono">🔐</div>

        <h1>Panel de administración</h1>
        <p>HUANGUELÉN DONA VIDA</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input
                type="password"
                name="password"
                placeholder="Contraseña de administrador"
                required
                autocomplete="current-password"
            >

            <button type="submit">Ingresar</button>
        </form>

        <a class="volver" href="/">← Volver al inicio</a>
    </main>

</body>
</html>
