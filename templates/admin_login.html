
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso administrador | Huanguelén Dona Vida</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef5fc;
      color: #18324d;
    }
    .login {
      width: 100%;
      max-width: 410px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #17395c18;
    }
    h1 { color: #1769c2; margin-top: 0; }
    p { color: #647b91; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd8e5;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1769c2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .error {
      padding: 11px;
      border-radius: 8px;
      color: #a11;
      background: #fff0f0;
    }
    a { display: inline-block; margin-top: 18px; color: #1769c2; }
  </style>
</head>
<body>
  <main class="login">
    <h1>Panel de administración</h1>
    <p>Huanguelén Dona Vida</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Ingresá tu contraseña"
        autocomplete="current-password"
        required
      >
      <button type="submit">Ingresar</button>
    </form>

    <a href="{{ url_for('inicio') }}">Volver a la página principal</a>
  </main>
</body>
</html>
